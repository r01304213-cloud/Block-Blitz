 d.style.gridTemplateColumns=`repeat(${w},${sz}px)`;d.style.gridAutoRows=sz+'px';
 const S=new Set(c.map(x=>x[0]*w+x[1]));
 for(let i=0;i<w*h;i++){const e=document.createElement('i');if(S.has(i)){e.className='f';e.style.background=col}d.appendChild(e)}
 return d}
function renderBoard(pv,col){for(let i=0;i<100;i++){const v=grid[i/10|0][i%10],e=cells[i];
 e.className='c'+(v?' f':'');e.style.background=v?COL[v-1]:'';e.style.opacity='';
 if(!v&&pv&&pv.has(i)){e.style.background=col;e.style.opacity='.5'}}}
function renderTray(){tray.innerHTML='';pieces.forEach((p,i)=>{const s=document.createElement('div');s.className='slot';s.dataset.i=i;if(!p.used)s.appendChild(mk(p.cells,ts,COL[p.col]));tray.appendChild(s)})}

function size(){cs=Math.max(24,Math.min(44,Math.floor((innerWidth-24)/10),Math.floor((innerHeight-210)/14.2)));
 ts=Math.floor(cs*.55);ns=Math.max(8,Math.floor(cs*.28));
 const r=document.documentElement.style;r.setProperty('--cs',cs+'px');r.setProperty('--ts',ts+'px');
 board.style.gridTemplateColumns=`repeat(10,${cs}px)`;
 fx.width=fx.height=10*cs*dpr;fx.style.width=fx.style.height=10*cs+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
 if(grid)renderAll()}

/* ---------- efek ---------- */
const P=[];let raf=0;
function burst(i,col,k){const x=(i%10+.5)*cs,y=(Math.floor(i/10)+.5)*cs;
 for(let j=0;j<k;j++){const a=Math.random()*6.28,s=1+Math.random()*4;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,l:1,c:col,z:2+Math.random()*cs/6})}
 if(!raf)raf=requestAnimationFrame(loop)}
function loop(){ctx.clearRect(0,0,10*cs,10*cs);
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.l-=.025;
  if(p.l<=0){P.splice(i,1);continue}ctx.globalAlpha=p.l;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.z,p.z)}
 ctx.globalAlpha=1;raf=P.length?requestAnimationFrame(loop):0}
function popup(n,pts,sk){const t=['','NICE!','DOUBLE!','TRIPLE!','QUAD!!','MEGA!!!'][Math.min(n,5)];
 const d=document.createElement('div');d.className='pop p'+Math.min(n,5);
 d.innerHTML=t+'<small>+'+pts+(sk>1?' · COMBO x'+sk:'')+'</small>';bw.appendChild(d);setTimeout(()=>d.remove(),1500);
 if(n>=2){bw.style.setProperty('--a',n*1.5+'px');bw.classList.remove('sh');void bw.offsetWidth;bw.classList.add('sh')}
 if(n>=3){fl.className='';void fl.offsetWidth;fl.className='go'}}

function beep(f,d,t='sine',v=.12,at=0){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
 const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+at;o.type=t;o.frequency.value=f;
 g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}

/* ---------- permainan ---------- */
function place(p,r,k){busy=true;
 p.cells.forEach(([a,b])=>grid[r+a][k+b]=p.col+1);p.used=true;score+=p.cells.length;beep(330,.08,'triangle');
 const{rows,cols}=fullLines(grid),set=new Set();
 rows.forEach(y=>{for(let x=0;x<N;x++)set.add(y*N+x)});cols.forEach(x=>{for(let y=0;y<N;y++)set.add(y*N+x)});
 const n=rows.length+cols.length;
 if(!n){miss++;if(miss>=3)streak=0;renderBoard();after();return}
 streak++;miss=0;lines+=n;
 const mult=Math.min(3,1+.25*(streak-1)),pts=Math.round((100*n+50*n*(n-1))*mult);score+=pts;
 renderBoard();
 set.forEach(i=>{const v=grid[i/10|0][i%10];cells[i].classList.add('clr');burst(i,COL[v-1],3+n*2)});
 popup(n,pts,streak);for(let j=0;j<Math.min(n,5)+1;j++)beep(440*Math.pow(1.25,j),.15,'square',.07,j*.07);
 hud();
 setTimeout(()=>{set.forEach(i=>grid[i/10|0][i%10]=0);renderBoard();after()},420)}
function after(){if(pieces.every(p=>p.used))deal();
 if(score>best){best=score;sv('bp_best',best)}
 renderTray();renderNext();hud();
 if(!pieces.some(p=>!p.used&&anyRot(grid,p.cells)))gameOver();else{busy=false;upsert();saveGame()}}

 upsert();sv('bp_game',null);
 beep(300,.25,'sawtooth',.1);beep(220,.25,'sawtooth',.1,.25);beep(150,.4,'sawtooth',.1,.5);
 show(`<h2>GAME OVER</h2><p style="text-align:center">Pemain: <b>${escapeHTML(playerName||"Pemain")}</b></p><p style="text-align:center">Tidak ada blok yang bisa ditempatkan</p><small>SKOR AKHIR</small><div class="big">${score.toLocaleString("id-ID")}</div>
 ${score>bestStart&&score>0?'<p style="text-align:center;color:#feca57"><b>🎉 Rekor pribadi baru!</b></p>':''}
 <p style="text-align:center">Rekor pribadi: <b>${best}</b> · Garis: ${lines}</p>

 if(over||busy||!ov.hidden)return;const s=e.target.closest('.slot');if(!s)return;
 const i=+s.dataset.i,p=pieces[i];if(!p||p.used)return;
 drag={i,sx:e.clientX,sy:e.clientY,t:Date.now(),moved:false,slot:s};
 try{s.setPointerCapture(e.pointerId)}catch(_){}});

  drag.moved=true;const p=pieces[drag.i];ghost=mk(p.cells,cs,COL[p.col]);ghost.id='ghost';document.body.appendChild(ghost);
  drag.slot.style.opacity='.25'}

 const x=e.clientX,y=e.clientY-(e.pointerType==='touch'?cs*1.8:0);
 ghost.style.left=x-gw/2+'px';ghost.style.top=y-gh/2+'px';
 const R=bw.getBoundingClientRect(),k=Math.round((x-gw/2-R.left)/cs),r=Math.round((y-gh/2-R.top)/cs);
 if(fits(grid,p.cells,r,k)){target={r,k};renderBoard(new Set(p.cells.map(([a,b])=>(r+a)*N+k+b)),COL[p.col])}
 else{target=null;renderBoard()}});
function endDrag(e,cancel){if(!drag)return;const d=drag,p=pieces[d.i];drag=null;
 if(ghost){ghost.remove();ghost=null}
 if(!d.moved){if(!cancel&&Date.now()-d.t<500){p.cells=rot(p.cells);beep(520,.05,'triangle',.08)}renderTray();return}
 const t=target;target=null;
 if(t&&!cancel){place(p,t.r,t.k);renderTray()}else{renderBoard();renderTray()}}
window.addEventListener('pointerup',e=>endDrag(e,false));

function uploadAvatar(input){const f=input.files&&input.files[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){alert('Gunakan file JPG, PNG, atau WebP.');input.value='';return}if(f.size>2*1024*1024){alert('Ukuran foto maksimal 2 MB.');input.value='';return}const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{if(im.width>3000||im.height>3000){alert('Resolusi foto terlalu besar. Pilih gambar maksimal 3000 × 3000.');return}playerAvatar=rd.result;try{sv('bp_avatar',playerAvatar);openProfile()}catch(e){playerAvatar='';alert('Foto terlalu besar untuk penyimpanan browser. Coba gambar yang lebih kecil.')}};im.onerror=()=>alert('File gambar tidak bisa dibaca.');im.src=rd.result};rd.readAsDataURL(f)}

function setProfileTitle(v){const allowed=['NEW PLAYER','ROOKIE','RISING STAR','SCORE HUNTER','PRO PLAYER','GRANDMASTER','BLOCK LEGEND'];const max=titleForScore(Math.max(best,score));const rank=allowed.indexOf(v),maxRank=allowed.indexOf(max);if(rank>maxRank){alert('Title ini belum terbuka. Naikkan personal best untuk membukanya.');openProfile();return}chosenTitle=v;sv('bp_title',chosenTitle);openProfile()}
function viewProfile(name){if((name||'').toLowerCase()===(playerName||'').toLowerCase()){openProfile();return}const entry=lb.find(x=>(x.name||'').toLowerCase()===(name||'').toLowerCase());if(!entry){show('<h2>Profil tidak ditemukan</h2><button class="bt" onclick="renderLeaderboard()">Kembali</button>');return}show(`<h2>Player Profile</h2><div class="profile-hero"><div class="avatar" style="display:grid;place-items:center;font-size:27px;font-weight:900;color:var(--ac)">${escapeHTML((name||'P').slice(0,1).toUpperCase())}</div><div style="min-width:0"><div class="profile-name">${escapeHTML(name)}</div><div class="profile-title">${escapeHTML(titleForScore(Number(entry.s||0)))}</div></div></div><div class="profile-stats"><div class="profile-stat"><small>BEST SCORE IN LOCAL BOARD</small><b>${Number(entry.s||0).toLocaleString('id-ID')}</b></div><div class="profile-stat"><small>RECORDED DATE</small><b style="font-size:13px">${escapeHTML(entry.d||'—')}</b></div></div><button class="bt" onclick="renderLeaderboard()">Kembali ke leaderboard</button>`)}
// Supabase config is entered inside the game; the publishable key is never hard-coded into this file.
const DEFAULT_SB_URL = 'https://wsakbownwzbukhcxixyf.supabase.co';
const DEFAULT_SB_KEY = 'sb_publishable_LGWwmVu4jQCHi3ZjfijvJw_-efj3O4l';

let sbUrl=String(ld('bp_sb_url',DEFAULT_SB_URL)||DEFAULT_SB_URL).replace(/\/$/,'');
let sbKey=String(ld('bp_sb_key',DEFAULT_SB_KEY)||DEFAULT_SB_KEY);
let globalRows=[];
function supabaseReady(){return /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(sbUrl)&&/^sb_publishable_[A-Za-z0-9_-]+$/.test(sbKey)}
function globalConfigHTML(msg=''){
 return `<h2>Hubungkan Leaderboard Global</h2><p class="mutednote">Masukkan URL project dan <b>Publishable key</b> Supabase. Key ini boleh dipakai di browser; jangan gunakan secret/service_role key.</p>
 <label style="display:block;text-align:left;font-size:12px;font-weight:800">PROJECT URL</label><input id="sbUrlInput" class="inputname" type="url" placeholder="https://xxxx.supabase.co" value="${escapeAttr(sbUrl)}" autocomplete="url">
 <label style="display:block;text-align:left;font-size:12px;font-weight:800">PUBLISHABLE KEY</label><input id="sbKeyInput" class="inputname" type="password" placeholder="sb_publishable_..." value="${escapeAttr(sbKey)}" autocomplete="off">
 <p class="mutednote">Konfigurasi disimpan hanya di browser/perangkat ini. Belum mengirim skor ke server.</p><div id="sbStatus" class="rulesbox" role="status">${escapeHTML(msg||'Belum dites.')}</div>
 <button class="bt" onclick="saveSupabaseConfig()">Simpan & Tes</button> <button class="bt g" onclick="renderLeaderboard()">Kembali</button>`;
}
function showGlobalConfig(msg=''){show(globalConfigHTML(msg))}
async function sbRpc(fn,args){
 if(!supabaseReady())throw new Error('Supabase belum dikonfigurasi.');
 const res=await fetch(`${sbUrl}/rest/v1/rpc/${fn}`,{
  method:'POST',headers:{apikey:sbKey,Authorization:`Bearer ${sbKey}`,'Content-Type':'application/json'},body:JSON.stringify(args)
 });
 const body=await res.json().catch(()=>null);
 if(!res.ok)throw new Error(body?.message||body?.details||body?.hint||`RPC ${fn} gagal (HTTP ${res.status})`);
 return body;
}
async function saveSupabaseConfig(){
 const url=($('#sbUrlInput')?.value||'').trim().replace(/\/$/,'');
 const key=($('#sbKeyInput')?.value||'').trim();
 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){showGlobalConfig('URL belum benar. Salin Project URL dari Supabase, contohnya https://xxxx.supabase.co');return}
 if(!/^sb_publishable_[A-Za-z0-9_-]+$/.test(key)){showGlobalConfig('Key harus diawali sb_publishable_. Jangan masukkan sb_secret_ atau service_role.');return}
 sbUrl=url;sbKey=key;sv('bp_sb_url',sbUrl);sv('bp_sb_key',sbKey);
 showGlobalConfig('Menguji koneksi…');
 try{
  const res=await fetch(`${sbUrl}/rest/v1/players?select=user_id,username,best_score&order=best_score.desc&limit=100`,{headers:{apikey:sbKey,Authorization:`Bearer ${sbKey}`}});
  const body=await res.json().catch(()=>null);
  if(!res.ok)throw new Error(body?.message||body?.hint||`HTTP ${res.status}`);
  if(!Array.isArray(body))throw new Error('Respons database tidak sesuai.');
  globalRows=body;renderGlobalLeaderboard('Koneksi berhasil! Data leaderboard berhasil dibaca.');
 }catch(e){showGlobalConfig('Gagal konek: '+String(e.message||e)+'\nPeriksa URL/key dan pastikan tabel public.players punya izin SELECT.');}
}
async function loadGlobalLeaderboard(){
 if(!supabaseReady()){showGlobalConfig('Masukkan Project URL dan Publishable key untuk menghubungkan.');return}
 show(`<h2>Leaderboard Global</h2><p class="mutednote">Mengambil data dari Supabase…</p><button class="bt g" onclick="renderLeaderboard()">Kembali</button>`);
 try{const res=await fetch(`${sbUrl}/rest/v1/players?select=user_id,username,best_score&order=best_score.desc&limit=100`,{headers:{apikey:sbKey,Authorization:`Bearer ${sbKey}`}});const body=await res.json().catch(()=>null);if(!res.ok)throw new Error(body?.message||`HTTP ${res.status}`);if(!Array.isArray(body))throw new Error('Format data tidak sesuai.');globalRows=body;renderGlobalLeaderboard()}catch(e){show(`<h2>Leaderboard Global</h2><p class="mutednote">Gagal memuat data: ${escapeHTML(e.message||e)}</p><button class="bt" onclick="showGlobalConfig()">Pengaturan koneksi</button> <button class="bt g" onclick="renderLeaderboard()">Kembali</button>`)}
}
async function syncLocalBestToGlobal(){
 if(!supabaseReady()){showGlobalConfig('Hubungkan Supabase dulu.');return}
 if(!ld('bp_global_registered',false)||!/^\d{8}$/.test(playerId)){
  show('<h2>Belum terhubung ke akun global</h2><p class="mutednote">Daftarkan akun dengan username yang benar dulu. Jangan buat akun baru kalau User ID akun ini sudah ada.</p><button class="bt" onclick="showName()">Daftar / masuk</button><button class="bt g" onclick="loadGlobalLeaderboard()">Kembali</button>');return;
 }
 const localBest=Math.max(Number(best)||0,Number(score)||0,...lb.filter(x=>(x.name||'').toLowerCase()===String(playerName||'').toLowerCase()).map(x=>Number(x.s)||0));
 try{
  await sbRpc('submit_score',{p_user_id:playerId,p_score:Math.max(0,Math.floor(localBest))});
  await loadGlobalLeaderboard();
 }catch(e){show(`<h2>Sinkronisasi gagal</h2><p class="mutednote">${escapeHTML(e.message||e)}</p><button class="bt" onclick="syncLocalBestToGlobal()">Coba lagi</button><button class="bt g" onclick="loadGlobalLeaderboard()">Kembali</button>`)}
}
function renderGlobalLeaderboard(msg=''){
 const rows=globalRows.slice(0,100);const my=rows.findIndex(x=>String(x.user_id||'')===playerId);
 show(`<h2>Leaderboard Global</h2><p class="mutednote">${msg?escapeHTML(msg):'Data dari database Supabase · Top 100'}</p><div class="rank-note"><span>◎</span><div><b>YOUR RANK · GLOBAL TOP 100</b><p>${my>=0?'#'+(my+1)+' · '+Number(rows[my].best_score||0).toLocaleString('id-ID')+' poin':(ld('bp_global_registered',false)?'Pemain terdaftar; belum masuk Top 100.':'Belum terdaftar global. Buka Ganti nama untuk registrasi.')}</p></div></div>
 ${rows.length?rows.map((x,i)=>`<div class="lb"><span><b style="color:var(--ac);margin-right:8px">${String(i+1).padStart(2,'0')}</b>${escapeHTML(x.username||'Pemain')}<small style="display:block;margin:3px 0 0 29px;color:var(--mu);font-weight:500">ID ${escapeHTML(x.user_id||'')}</small></span><b>${Number(x.best_score||0).toLocaleString('id-ID')}</b></div>`).join(''):'<div class="rulesbox">Belum ada pemain terdaftar di database.</div>'}
 <button class="bt" onclick="loadGlobalLeaderboard()">↻ Muat ulang</button> <button class="bt" onclick="syncLocalBestToGlobal()">Kirim Rekor Lokal</button> <button class="bt g" onclick="showName()">Daftar / Ganti nama</button> <button class="bt g" onclick="showGlobalConfig()">Pengaturan</button> <button class="bt g" onclick="renderLeaderboard()">Lokal</button>`);
}
function leaderboardHTML(){
 const top=[...lb].sort((a,b)=>(b.s||0)-(a.s||0)).slice(0,100), podium=top.slice(0,3);
 return `<h2>Leaderboard</h2><p class="mutednote">Pemain saat ini: <b>${escapeHTML(playerName||'Belum diatur')}</b></p>
 <div class="rank-tabs"><button class="active" onclick="renderLeaderboard()">PERANGKAT</button><button onclick="loadGlobalLeaderboard()">GLOBAL</button><button onclick="showGlobalInfo()">MINGGUAN</button></div>
 <div class="rank-title">PODIUM · TOP 3 LOKAL</div>
 <div class="podium">${[1,0,2].map(i=>{const x=podium[i],h=i===0?75:i===1?57:46;return `<div class="podium-person"><div class="medal">${['🥇','🥈','🥉'][i]}</div><span class="pname">${x?escapeHTML(x.name||'Pemain'):'Belum ada'}</span><span class="pscore">${x?Number(x.s||0).toLocaleString('id-ID'):'—'} pts</span><div class="podium-block" style="height:${h}px;background:${i===0?'#f2c45e':i===1?'#b8c6c9':'#c98f69'}">${i+1}</div></div>`}).join('')}</div>
 <div class="rank-note"><span>◎</span><div><b>YOUR RANK · LOKAL</b><p>${(()=>{const r=[...lb].sort((a,b)=>(b.s||0)-(a.s||0));const i=r.findIndex(x=>(x.name||'').toLowerCase()===(playerName||'').toLowerCase());return i>=0?'#'+(i+1)+' · '+Number(r[i].s||0).toLocaleString('id-ID')+' poin':'UNRANKED — mainkan ronde untuk mencatat skor';})()}</p></div></div>
 <div class="rank-title">DAFTAR SKOR · TOP 100 LOKAL</div>
 ${top.length?top.map((x,i)=>`<div class="lb"><span><b style="color:var(--ac);margin-right:8px">${String(i+1).padStart(2,'0')}</b>${escapeHTML(x.name||'Pemain')} <small style="display:block;margin:3px 0 0 29px;color:var(--mu);font-weight:500">${escapeHTML(x.d||'')}</small></span><b>${Number(x.s||0).toLocaleString('id-ID')}</b></div>`).join(''):'<div class="rulesbox"><b>Belum ada skor</b><p>Mainkan satu ronde untuk mulai mengisi peringkat di perangkat ini.</p></div>'}
 
 <button class="bt g" onclick="showName()">Ganti nama</button> <button class="bt" onclick="hide()">Tutup</button>`;
}
function renderLeaderboard(){show(leaderboardHTML())}
function showGlobalInfo(){show(`<h2>Leaderboard Mingguan</h2><p class="mutednote">Peringkat mingguan belum disiapkan. Leaderboard global dapat dibuka lewat tab GLOBAL.</p><button class="bt" onclick="loadGlobalLeaderboard()">Buka Global</button> <button class="bt g" onclick="renderLeaderboard()">Kembali</button>`)}
$('#blb').onclick=renderLeaderboard;$('#openRanks').onclick=renderLeaderboard;$('#bprof').onclick=openProfile;
function escapeHTML(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
addEventListener('resize',size);
size();if(!resume())start();if(!playerName)showName();else if(!st.tut)help();
const flush=()=>{if(grid&&!over){upsert();if(!busy)saveGame()}};
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
</script></body></html>
